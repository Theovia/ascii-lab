<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASCII Portrait — reactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0d0e;
    --fg: #ff6b2c;
    --amber: #f5a623;
    --line: rgba(255,255,255,0.16);
    --soft: rgba(255,255,255,0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
  }
  body { cursor: crosshair; }

  canvas#ascii {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
  }

  .badge {
    position: fixed; top: 24px; right: 24px;
    background: var(--fg);
    color: #141314;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
    padding: 11px 18px;
    border-radius: 2px;
    text-decoration: none;
    z-index: 10;
    transition: transform .25s cubic-bezier(.2,.8,.3,1), background .2s;
  }
  .badge:hover { transform: scale(1.05); background: #ff7d44; }

  .brand {
    position: fixed; top: 24px; left: 24px;
    z-index: 10;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.85);
  }
  .brand b { color: var(--fg); font-weight: 600; }
  .brand small {
    display: block;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--soft);
    margin-top: 4px;
  }

  /* Control panel — bottom drawer */
  .panel {
    position: fixed;
    left: 24px; right: 24px; bottom: 24px;
    z-index: 10;
    display: flex;
    gap: 14px;
    align-items: stretch;
    padding: 14px 18px;
    background: rgba(20, 19, 20, 0.78);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--soft);
  }
  .panel .group {
    display: flex; flex-direction: column;
    gap: 6px;
    min-width: 0;
    flex: 0 0 auto;
  }
  .panel .group.flex { flex: 1 1 auto; min-width: 140px; }
  .panel .group .label { color: rgba(255,255,255,0.4); }
  .panel .group .value { color: var(--fg); font-variant-numeric: tabular-nums; }
  .panel .row { display: flex; align-items: center; gap: 8px; }

  .panel button, .panel label.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    background: transparent;
    color: rgba(255,255,255,0.85);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: border-color .2s, color .2s, background .2s;
    white-space: nowrap;
  }
  .panel button:hover, .panel label.btn:hover {
    border-color: var(--fg);
    color: #fff;
  }
  .panel button.active {
    background: var(--fg);
    color: #141314;
    border-color: var(--fg);
  }
  .panel input[type="file"] { display: none; }

  /* Custom slider */
  .panel input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px;
    background: transparent;
    cursor: ew-resize;
    margin: 0;
  }
  .panel input[type="range"]::-webkit-slider-runnable-track {
    height: 2px; background: var(--line); border-radius: 1px;
  }
  .panel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; margin-top: -4px;
    background: var(--fg); border-radius: 50%;
    border: 2px solid #0e0d0e;
    transition: transform .15s;
  }
  .panel input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .meta {
    position: fixed; top: 24px;
    left: 50%; transform: translateX(-50%);
    z-index: 10;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--soft);
    text-align: center;
    line-height: 1.7;
  }
  .meta b { color: var(--fg); font-weight: 600; }

  .hint {
    position: fixed; left: 50%; bottom: 110px;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    pointer-events: none;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.28; } 50% { opacity: 0.65; } }

  .progress {
    position: fixed; top: 0; left: 0;
    height: 2px; width: 0%;
    background: var(--fg);
    z-index: 100;
    transition: width .15s ease;
  }
  .progress.hidden { opacity: 0; transition: opacity .3s ease; }
</style>
</head>
<body>
  <canvas id="ascii"></canvas>
  <div class="progress hidden" id="progress"></div>

  <div class="brand">
    Raul Chio · <b>portfolio</b>
    <small>ASCII Renderer · Cursor-Reactive</small>
  </div>

  <div class="meta">
    <b id="cellInfo">—</b><br />
    Canvas 2D · Offscreen base + dirty-rect overlay
  </div>

  <a class="badge" href="#contact">Let's work together</a>

  <div class="hint">— move cursor —</div>

  <div class="panel">
    <div class="group">
      <span class="label">Source</span>
      <label class="btn" for="file">Drop image</label>
      <input type="file" id="file" accept="image/*" />
    </div>

    <div class="group flex">
      <div class="row">
        <span class="label">Cell</span>
        <span class="value" id="cellVal">5px</span>
      </div>
      <input type="range" id="cellSize" min="3" max="14" step="1" value="5" />
    </div>

    <div class="group flex">
      <div class="row">
        <span class="label">Contrast</span>
        <span class="value" id="contrastVal">1.00</span>
      </div>
      <input type="range" id="contrast" min="40" max="220" step="2" value="100" />
    </div>

    <div class="group flex">
      <div class="row">
        <span class="label">Brightness</span>
        <span class="value" id="brightVal">0.00</span>
      </div>
      <input type="range" id="brightness" min="-50" max="50" step="2" value="0" />
    </div>

    <div class="group">
      <span class="label">Color</span>
      <div class="row">
        <button data-mode="amber" class="active">Amber</button>
        <button data-mode="true">True</button>
        <button data-mode="duo">Duo</button>
        <button data-mode="mono">Mono</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Ramp</span>
      <div class="row">
        <button data-ramp="rich" class="active">Rich</button>
        <button data-ramp="digits">Digits</button>
        <button data-ramp="basic">Basic</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Action</span>
      <div class="row">
        <button id="invertBtn">Invert</button>
        <button id="exportBtn">Export PNG</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('ascii');
  const ctx = canvas.getContext('2d', { alpha: false });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  // Offscreen base canvas — full ASCII without cursor effect
  const base = document.createElement('canvas');
  const baseCtx = base.getContext('2d', { alpha: false });

  // Sample canvas — image down-rezzed to cols×rows
  const sample = document.createElement('canvas');
  const sampleCtx = sample.getContext('2d', { willReadFrequently: true });

  const RAMPS = {
    rich:  ' .\'`,:;!iI?ltjf1234567890[]{}|()/\\<>+-*#$@%MW&8B',
    digits:' .,:;!?12345678901234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ#@MW',
    basic: ' .:-=+*#%@',
  };
  let rampKey = 'rich';
  let ramp = RAMPS[rampKey];

  const PALETTES_AMBER = { base: 28, drift: 22, sat: 88 };
  let colorMode = 'amber'; // amber | true | duo | mono
  let invert = false;

  let CELL = 5;
  let FONT_PX = 7;

  let sourceImg = null;
  let pixels = null;          // sampled RGB at cols×rows
  let cols = 0, rows = 0;
  let originX = 0, originY = 0;

  let contrast = 1.0;
  let brightDelta = 0.0;

  // Mouse
  const mouse = { x: -9999, y: -9999, lx: -9999, ly: -9999 };
  const ms = { x: -9999, y: -9999, intensity: 0 };

  const BG = '#0e0d0e';
  const RADIUS = 220;
  const PUSH_MAX = 26;

  function fontFor(cell) {
    // Heuristic: font ~1.45× cell width; tuned for monospace
    return Math.max(5, Math.round(cell * 1.6));
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    base.width = canvas.width;
    base.height = canvas.height;
    baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    layoutAndSample();
    renderBase();
  }

  function layoutAndSample() {
    if (!sourceImg) return;
    const w = window.innerWidth, h = window.innerHeight;
    const ar = sourceImg.width / sourceImg.height;
    let targetH = h * 0.92;
    let targetW = targetH * ar;
    if (targetW > w * 0.92) {
      targetW = w * 0.92;
      targetH = targetW / ar;
    }
    const cellW = CELL;
    const cellH = Math.round(CELL * 1.55);  // monospace cell aspect
    cols = Math.max(1, Math.floor(targetW / cellW));
    rows = Math.max(1, Math.floor(targetH / cellH));
    originX = (w - cols * cellW) / 2;
    originY = (h - rows * cellH) / 2;

    sample.width = cols;
    sample.height = rows;
    sampleCtx.fillStyle = '#000';
    sampleCtx.fillRect(0, 0, cols, rows);
    sampleCtx.drawImage(sourceImg, 0, 0, cols, rows);
    pixels = sampleCtx.getImageData(0, 0, cols, rows).data;

    document.getElementById('cellInfo').textContent =
      `${cols.toLocaleString()} × ${rows.toLocaleString()} cells · ${(cols*rows).toLocaleString()} glyphs`;
  }

  function adj(b) {
    // Apply contrast + brightness: pivot 0.5
    let v = (b - 0.5) * contrast + 0.5 + brightDelta;
    if (invert) v = 1 - v;
    return v < 0 ? 0 : v > 1 ? 1 : v;
  }

  function colorFor(R, G, B, litB, mode) {
    if (mode === 'true') {
      // Boost saturation a touch. RGB → HSL → tweak L → back.
      const max = Math.max(R, G, B), min = Math.min(R, G, B);
      const lum = (max + min) / 510; // 0..1
      const targetL = 0.30 + litB * 0.55;
      const k = lum > 0 ? targetL / lum : 1;
      let r = Math.min(255, R * k);
      let g = Math.min(255, G * k);
      let b = Math.min(255, B * k);
      return `rgb(${r|0},${g|0},${b|0})`;
    }
    if (mode === 'mono') {
      const v = (15 + litB * 240) | 0;
      return `rgb(${v},${v},${v})`;
    }
    if (mode === 'duo') {
      // Cyan→magenta gradient
      const r = (40 + litB * 215) | 0;
      const g = (200 - litB * 130) | 0;
      const b = (240 - litB * 60) | 0;
      return `rgb(${r},${g},${b})`;
    }
    // amber default
    const hue = PALETTES_AMBER.base;
    const sat = PALETTES_AMBER.sat;
    const light = 22 + litB * 56;
    return `hsl(${hue},${sat}%,${light}%)`;
  }

  function colorWithBoost(R, G, B, litB, hueBoost, mode) {
    if (mode === 'amber') {
      const hue = PALETTES_AMBER.base + hueBoost;
      const sat = PALETTES_AMBER.sat;
      const light = 28 + litB * 60;
      return `hsl(${hue},${sat}%,${light}%)`;
    }
    if (mode === 'true' && hueBoost > 0) {
      // Brighten + tint warm under cursor
      const max = Math.max(R, G, B), min = Math.min(R, G, B);
      const lum = (max + min) / 510;
      const targetL = 0.45 + litB * 0.55;
      const k = lum > 0 ? targetL / lum : 1;
      let r = Math.min(255, R * k * 1.15);
      let g = Math.min(255, G * k * 1.05);
      let b = Math.min(255, B * k * 0.9);
      return `rgb(${r|0},${g|0},${b|0})`;
    }
    return colorFor(R, G, B, litB, mode);
  }

  function setProgress(p) {
    const el = document.getElementById('progress');
    if (p >= 1 || p < 0) {
      el.classList.add('hidden');
      el.style.width = '0%';
    } else {
      el.classList.remove('hidden');
      el.style.width = (p * 100).toFixed(1) + '%';
    }
  }

  let renderingBase = false;
  async function renderBase() {
    if (!pixels) return;
    renderingBase = true;
    const w = window.innerWidth, h = window.innerHeight;
    baseCtx.fillStyle = BG;
    baseCtx.fillRect(0, 0, w, h);
    FONT_PX = fontFor(CELL);
    baseCtx.font = `500 ${FONT_PX}px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace`;
    baseCtx.textBaseline = 'top';

    const cellW = CELL;
    const cellH = Math.round(CELL * 1.55);
    const total = cols * rows;
    const chunk = 4000; // cells per chunk
    let i = 0, cellIdx = 0;

    while (cellIdx < total) {
      const end = Math.min(cellIdx + chunk, total);
      for (; cellIdx < end; cellIdx++) {
        const c = cellIdx % cols;
        const r = (cellIdx / cols) | 0;
        const pi = cellIdx * 4;
        const R = pixels[pi], G = pixels[pi+1], B = pixels[pi+2];
        const lum = (0.299*R + 0.587*G + 0.114*B) / 255;
        const litB = adj(lum);
        if (litB < 0.04) continue;
        const ch = ramp[Math.floor(litB * (ramp.length - 1))];
        baseCtx.fillStyle = colorFor(R, G, B, litB, colorMode);
        baseCtx.fillText(ch, originX + c * cellW, originY + r * cellH);
      }
      setProgress(cellIdx / total);
      if (cellIdx < total) await new Promise(r => requestAnimationFrame(r));
    }
    setProgress(1);
    renderingBase = false;
  }

  function loadImage(src) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      sourceImg = img;
      layoutAndSample();
      renderBase();
    };
    img.onerror = (e) => console.warn('img load fail', e);
    img.src = src;
  }

  // Procedural placeholder with shading folds for tonal range
  const PLACEHOLDER_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 850' preserveAspectRatio='xMidYMid meet'>
    <defs>
      <radialGradient id='head' cx='40%' cy='35%' r='60%'>
        <stop offset='0%' stop-color='#fff'/>
        <stop offset='60%' stop-color='#bbb'/>
        <stop offset='100%' stop-color='#444'/>
      </radialGradient>
      <linearGradient id='torso' x1='0%' y1='0%' x2='100%' y2='80%'>
        <stop offset='0%' stop-color='#666'/>
        <stop offset='50%' stop-color='#aaa'/>
        <stop offset='100%' stop-color='#333'/>
      </linearGradient>
      <linearGradient id='arm' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#888'/>
        <stop offset='100%' stop-color='#222'/>
      </linearGradient>
    </defs>
    <rect width='600' height='850' fill='#0a0a0a'/>
    <ellipse cx='270' cy='150' rx='78' ry='95' fill='url(#head)'/>
    <path d='M 240 235 Q 270 250 305 240 L 320 280 L 245 285 Z' fill='#888'/>
    <path d='M 175 285 Q 210 305 280 295 L 360 295 Q 425 305 440 380 Q 445 440 415 490 Q 360 510 280 500 L 220 490 Q 155 410 175 285 Z' fill='url(#torso)'/>
    <path d='M 365 320 Q 440 290 445 215 Q 425 192 388 210 Q 365 250 345 290 Z' fill='url(#arm)'/>
    <ellipse cx='418' cy='192' rx='34' ry='28' fill='#bbb'/>
    <path d='M 215 370 Q 175 470 235 560 Q 280 605 330 625 L 355 605 Q 305 565 280 495 Q 245 425 225 370 Z' fill='#555'/>
    <path d='M 220 480 Q 245 545 218 635 L 195 800 L 320 800 L 348 635 Q 388 555 348 480 Q 285 495 220 480 Z' fill='#444'/>
    <rect x='80' y='800' width='440' height='8' fill='#333'/>
  </svg>`;
  const PLACEHOLDER_URL = 'data:image/svg+xml;utf8,' + encodeURIComponent(PLACEHOLDER_SVG);

  // ───────── Animation loop ─────────
  function frame() {
    // Smooth mouse + intensity
    ms.x += (mouse.x - ms.x) * 0.22;
    ms.y += (mouse.y - ms.y) * 0.22;
    const speed = Math.hypot(mouse.x - mouse.lx, mouse.y - mouse.ly);
    mouse.lx = mouse.x; mouse.ly = mouse.y;
    ms.intensity += (Math.min(speed, 80) / 80 - ms.intensity) * 0.08;

    const w = window.innerWidth, h = window.innerHeight;

    // 1. Copy base
    if (renderingBase || !pixels) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);
    } else {
      ctx.drawImage(base, 0, 0, base.width, base.height, 0, 0, w, h);
    }

    // 2. Cursor dirty rect
    if (pixels && !renderingBase && mouse.x > -1000) {
      const cx = ms.x, cy = ms.y;
      const reach = RADIUS + PUSH_MAX + CELL * 2;
      const rx0 = Math.max(0, cx - reach);
      const ry0 = Math.max(0, cy - reach);
      const rx1 = Math.min(w, cx + reach);
      const ry1 = Math.min(h, cy + reach);

      ctx.fillStyle = BG;
      ctx.fillRect(rx0, ry0, rx1 - rx0, ry1 - ry0);

      const cellW = CELL;
      const cellH = Math.round(CELL * 1.55);
      const cMin = Math.max(0, Math.floor((rx0 - originX) / cellW));
      const cMax = Math.min(cols, Math.ceil((rx1 - originX) / cellW));
      const rMin = Math.max(0, Math.floor((ry0 - originY) / cellH));
      const rMax = Math.min(rows, Math.ceil((ry1 - originY) / cellH));

      ctx.font = `500 ${FONT_PX}px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace`;
      ctx.textBaseline = 'top';

      const RADIUS_SQ = RADIUS * RADIUS;
      for (let r = rMin; r < rMax; r++) {
        for (let c = cMin; c < cMax; c++) {
          const baseX = originX + c * cellW;
          const baseY = originY + r * cellH;
          const dx = baseX - cx;
          const dy = baseY - cy;
          const d2 = dx * dx + dy * dy;

          const pi = (r * cols + c) * 4;
          const R = pixels[pi], G = pixels[pi+1], B = pixels[pi+2];
          const lum = (0.299*R + 0.587*G + 0.114*B) / 255;
          let litB = adj(lum);

          let x = baseX, y = baseY, hueBoost = 0;
          if (d2 < RADIUS_SQ) {
            const d = Math.sqrt(d2);
            const f = 1 - d / RADIUS;
            const fs = f * f * (3 - 2 * f);
            const a = Math.atan2(dy, dx);
            const push = PUSH_MAX * fs * (0.55 + ms.intensity * 0.7);
            x += Math.cos(a) * push;
            y += Math.sin(a) * push;
            litB = Math.min(1, litB + fs * 0.5);
            hueBoost = fs * 18;
          }

          if (litB < 0.04) continue;
          const ch = ramp[Math.floor(litB * (ramp.length - 1))];
          ctx.fillStyle = colorWithBoost(R, G, B, litB, hueBoost, colorMode);
          ctx.fillText(ch, x, y);
        }
      }
    }

    requestAnimationFrame(frame);
  }

  // ───────── Events ─────────
  let resizeTO;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTO);
    resizeTO = setTimeout(resize, 80);
  });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, { passive: true });

  document.getElementById('file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    loadImage(URL.createObjectURL(f));
  });

  // Cell size slider
  const cellSlider = document.getElementById('cellSize');
  const cellVal = document.getElementById('cellVal');
  cellSlider.addEventListener('input', () => {
    CELL = parseInt(cellSlider.value, 10);
    cellVal.textContent = CELL + 'px';
    layoutAndSample();
    renderBase();
  });

  // Contrast / brightness
  const contrastSlider = document.getElementById('contrast');
  const contrastVal = document.getElementById('contrastVal');
  contrastSlider.addEventListener('input', () => {
    contrast = parseInt(contrastSlider.value, 10) / 100;
    contrastVal.textContent = contrast.toFixed(2);
    renderBase();
  });
  const brightSlider = document.getElementById('brightness');
  const brightVal = document.getElementById('brightVal');
  brightSlider.addEventListener('input', () => {
    brightDelta = parseInt(brightSlider.value, 10) / 100;
    brightVal.textContent = brightDelta.toFixed(2);
    renderBase();
  });

  // Color mode
  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      colorMode = btn.dataset.mode;
      renderBase();
    });
  });

  // Ramp
  document.querySelectorAll('[data-ramp]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-ramp]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      rampKey = btn.dataset.ramp;
      ramp = RAMPS[rampKey];
      renderBase();
    });
  });

  document.getElementById('invertBtn').addEventListener('click', () => {
    invert = !invert;
    renderBase();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `ascii-portrait-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Boot
  resize();
  loadImage(PLACEHOLDER_URL);
  requestAnimationFrame(frame);
})();
</script>
