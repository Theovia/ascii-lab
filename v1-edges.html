<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>v1 — DoG Edges (Acerola)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --fg: #46e6c4;
    --line: rgba(255,255,255,0.16);
    --soft: rgba(255,255,255,0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
  body { cursor: crosshair; }
  canvas#ascii { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .badge {
    position: fixed; top: 24px; right: 24px;
    background: var(--fg); color: #0a0a0c;
    font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    font-size: 11px; padding: 11px 18px; border-radius: 2px;
    text-decoration: none; z-index: 10;
  }
  .brand { position: fixed; top: 24px; left: 24px; z-index: 10; font-size: 13px; letter-spacing: 0.04em; color: rgba(255,255,255,0.85); }
  .brand b { color: var(--fg); font-weight: 600; }
  .brand small { display: block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--soft); margin-top: 4px; }
  .meta { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft); text-align: center; line-height: 1.7; }
  .meta b { color: var(--fg); font-weight: 600; }
  .panel {
    position: fixed; left: 24px; right: 24px; bottom: 24px; z-index: 10;
    display: flex; gap: 14px; align-items: stretch; padding: 14px 18px;
    background: rgba(15, 15, 18, 0.78);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid var(--line); border-radius: 4px;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft);
  }
  .panel .group { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 0 0 auto; }
  .panel .group.flex { flex: 1 1 auto; min-width: 130px; }
  .panel .group .label { color: rgba(255,255,255,0.4); }
  .panel .group .value { color: var(--fg); font-variant-numeric: tabular-nums; }
  .panel .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel button, .panel label.btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
    background: transparent; color: rgba(255,255,255,0.85);
    font-family: inherit; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    transition: border-color .2s, color .2s, background .2s; white-space: nowrap;
  }
  .panel button:hover, .panel label.btn:hover { border-color: var(--fg); color: #fff; }
  .panel button.active { background: var(--fg); color: #0a0a0c; border-color: var(--fg); }
  .panel input[type="file"] { display: none; }
  .panel input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: ew-resize; margin: 0; }
  .panel input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 1px; }
  .panel input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; margin-top: -4px; background: var(--fg); border-radius: 50%; border: 2px solid #0a0a0c; transition: transform .15s; }
  .panel input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }
  .progress { position: fixed; top: 0; left: 0; height: 2px; width: 0%; background: var(--fg); z-index: 100; transition: width .15s ease; }
  .progress.hidden { opacity: 0; transition: opacity .3s ease; }
  .nav { position: fixed; bottom: 24px; right: 24px; display: none; }
  .home {
    position: fixed; top: 24px; left: 240px; z-index: 10;
    color: var(--soft); text-decoration: none; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 2px;
  }
  .home:hover { color: #fff; border-color: var(--fg); }
</style>
</head>
<body>
  <canvas id="ascii"></canvas>
  <div class="progress hidden" id="progress"></div>

  <div class="brand">
    Raul Chio · <b>ASCII Lab</b>
    <small>v1 · DoG Edges (Acerola)</small>
  </div>
  <a class="home" href="index.html">← lab</a>

  <div class="meta">
    <b id="cellInfo">—</b><br />
    Sobel + edge-direction quantization
  </div>

  <a class="badge" href="#">v1 / edges</a>

  <div class="panel">
    <div class="group">
      <span class="label">Source</span>
      <label class="btn" for="file">Drop image</label>
      <input type="file" id="file" accept="image/*" />
    </div>
    <div class="group flex">
      <div class="row"><span class="label">Cell</span><span class="value" id="cellVal">6px</span></div>
      <input type="range" id="cellSize" min="3" max="14" step="1" value="6" />
    </div>
    <div class="group flex">
      <div class="row"><span class="label">Edge thresh</span><span class="value" id="threshVal">0.30</span></div>
      <input type="range" id="thresh" min="5" max="80" step="1" value="30" />
    </div>
    <div class="group flex">
      <div class="row"><span class="label">DoG sigma</span><span class="value" id="sigmaVal">1.4</span></div>
      <input type="range" id="sigma" min="6" max="30" step="1" value="14" />
    </div>
    <div class="group">
      <span class="label">Mode</span>
      <div class="row">
        <button data-mode="hybrid" class="active">Hybrid</button>
        <button data-mode="edges">Edges only</button>
        <button data-mode="fill">Fill only</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Color</span>
      <div class="row">
        <button data-color="mint" class="active">Mint</button>
        <button data-color="amber">Amber</button>
        <button data-color="true">True</button>
        <button data-color="mono">Mono</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Action</span>
      <div class="row">
        <button id="invertBtn">Invert</button>
        <button id="exportBtn">PNG</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('ascii');
  const ctx = canvas.getContext('2d', { alpha: false });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const base = document.createElement('canvas');
  const baseCtx = base.getContext('2d', { alpha: false });

  const sample = document.createElement('canvas');
  const sampleCtx = sample.getContext('2d', { willReadFrequently: true });

  // Brightness ramp for fill regions
  const FILL_RAMP = ' .\'`,:;!iI?ltjf1234567890[]{}|()*#$@%MW&8B';
  // Edge chars by direction bin (0=vertical, 1=diag NE→SW, 2=horizontal, 3=diag NW→SE)
  const EDGE_CHARS = ['|', '\\', '_', '/'];

  const PALETTES = {
    mint:  { hue: 158, drift: 25, sat: 70, baseL: 28, gainL: 55 },
    amber: { hue: 28,  drift: 22, sat: 88, baseL: 22, gainL: 56 },
    mono:  { hue: 0,   drift: 0,  sat: 0,  baseL: 25, gainL: 60 },
  };
  let colorKey = 'mint';
  let mode = 'hybrid';
  let invert = false;
  let CELL = 6;
  let FONT_PX = 10;
  let edgeThresh = 0.30;
  let dogSigma = 1.4;

  let sourceImg = null;
  let bright = null;     // Float32 brightness per cell
  let edgeMag = null;    // Float32 magnitude per cell
  let edgeBin = null;    // Uint8 direction bin per cell
  let pixelsRGB = null;  // Uint8Clamped RGBA per cell
  let cols = 0, rows = 0, originX = 0, originY = 0;

  const mouse = { x: -9999, y: -9999, lx: -9999, ly: -9999 };
  const ms = { x: -9999, y: -9999, intensity: 0 };
  const RADIUS = 220, PUSH_MAX = 24;
  const BG = '#0a0a0c';

  function fontFor(cell) { return Math.max(5, Math.round(cell * 1.6)); }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    base.width = canvas.width; base.height = canvas.height;
    baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutAndSample();
    renderBase();
  }

  // Gaussian blur 1D applied separably (in-place) on a Float32 grid
  function gaussianBlur(grid, w, h, sigma) {
    const radius = Math.max(1, Math.ceil(sigma * 2.5));
    const kernel = new Float32Array(radius * 2 + 1);
    let sum = 0;
    for (let i = -radius; i <= radius; i++) {
      const v = Math.exp(-(i * i) / (2 * sigma * sigma));
      kernel[i + radius] = v;
      sum += v;
    }
    for (let i = 0; i < kernel.length; i++) kernel[i] /= sum;
    const tmp = new Float32Array(grid.length);
    // Horizontal
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let k = -radius; k <= radius; k++) {
          const xx = Math.min(w - 1, Math.max(0, x + k));
          acc += grid[y * w + xx] * kernel[k + radius];
        }
        tmp[y * w + x] = acc;
      }
    }
    // Vertical
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let acc = 0;
        for (let k = -radius; k <= radius; k++) {
          const yy = Math.min(h - 1, Math.max(0, y + k));
          acc += tmp[yy * w + x] * kernel[k + radius];
        }
        grid[y * w + x] = acc;
      }
    }
  }

  function computeFields() {
    const total = cols * rows;
    pixelsRGB = sampleCtx.getImageData(0, 0, cols, rows).data;
    // Build brightness grid (Float32)
    const lum = new Float32Array(total);
    for (let i = 0; i < total; i++) {
      const p = i * 4;
      lum[i] = (0.299 * pixelsRGB[p] + 0.587 * pixelsRGB[p+1] + 0.114 * pixelsRGB[p+2]) / 255;
    }

    // DoG: blur1 (sigma) - blur2 (1.6 * sigma)
    const g1 = new Float32Array(lum);
    const g2 = new Float32Array(lum);
    gaussianBlur(g1, cols, rows, dogSigma);
    gaussianBlur(g2, cols, rows, dogSigma * 1.6);

    bright = g1; // use blurred for fill ramp (less noise)

    // Sobel on g1 for edge gradient
    const gx = new Float32Array(total), gy = new Float32Array(total);
    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1; x < cols - 1; x++) {
        const i = y * cols + x;
        const tl = g1[i - cols - 1], tc = g1[i - cols], tr = g1[i - cols + 1];
        const ml = g1[i - 1],                                  mr = g1[i + 1];
        const bl = g1[i + cols - 1], bc = g1[i + cols], br = g1[i + cols + 1];
        gx[i] = (tr + 2 * mr + br) - (tl + 2 * ml + bl);
        gy[i] = (bl + 2 * bc + br) - (tl + 2 * tc + tr);
      }
    }

    // Magnitude blends Sobel + DoG
    edgeMag = new Float32Array(total);
    edgeBin = new Uint8Array(total);
    let maxMag = 0.0001;
    for (let i = 0; i < total; i++) {
      const sm = Math.hypot(gx[i], gy[i]);
      const dm = Math.abs(g1[i] - g2[i]);
      const m = sm * 0.65 + dm * 4.0;
      edgeMag[i] = m;
      if (m > maxMag) maxMag = m;
      // Direction bin
      const theta = Math.atan2(gy[i], gx[i]);
      let phi = theta;
      if (phi < 0) phi += Math.PI;        // map to [0, π)
      const bin = Math.round(phi / (Math.PI / 4)) % 4;
      edgeBin[i] = bin;
    }
    // Normalize edgeMag to [0, 1]
    for (let i = 0; i < total; i++) edgeMag[i] /= maxMag;
  }

  function layoutAndSample() {
    if (!sourceImg) return;
    const w = window.innerWidth, h = window.innerHeight;
    const ar = sourceImg.width / sourceImg.height;
    let targetH = h * 0.92;
    let targetW = targetH * ar;
    if (targetW > w * 0.92) { targetW = w * 0.92; targetH = targetW / ar; }
    const cellW = CELL, cellH = Math.round(CELL * 1.55);
    cols = Math.max(2, Math.floor(targetW / cellW));
    rows = Math.max(2, Math.floor(targetH / cellH));
    originX = (w - cols * cellW) / 2;
    originY = (h - rows * cellH) / 2;
    sample.width = cols; sample.height = rows;
    sampleCtx.fillStyle = '#000'; sampleCtx.fillRect(0, 0, cols, rows);
    sampleCtx.drawImage(sourceImg, 0, 0, cols, rows);
    computeFields();
    document.getElementById('cellInfo').textContent =
      `${cols.toLocaleString()} × ${rows.toLocaleString()} cells · DoG σ=${dogSigma.toFixed(2)}`;
  }

  function colorFor(R, G, B, b, edgeStrength) {
    if (colorKey === 'true') {
      const max = Math.max(R, G, B), min = Math.min(R, G, B);
      const lum = (max + min) / 510;
      const targetL = 0.32 + b * 0.55 + edgeStrength * 0.2;
      const k = lum > 0 ? Math.min(2.5, targetL / lum) : 1;
      return `rgb(${Math.min(255, R * k)|0},${Math.min(255, G * k)|0},${Math.min(255, B * k)|0})`;
    }
    const p = PALETTES[colorKey] || PALETTES.mint;
    const light = p.baseL + b * p.gainL + edgeStrength * 12;
    return `hsl(${p.hue}, ${p.sat}%, ${light}%)`;
  }

  function adj(b) { return invert ? 1 - b : b; }

  function setProgress(p) {
    const el = document.getElementById('progress');
    if (p >= 1 || p < 0) { el.classList.add('hidden'); el.style.width = '0%'; }
    else { el.classList.remove('hidden'); el.style.width = (p * 100).toFixed(1) + '%'; }
  }

  let renderingBase = false;
  async function renderBase() {
    if (!bright) return;
    renderingBase = true;
    const w = window.innerWidth, h = window.innerHeight;
    baseCtx.fillStyle = BG; baseCtx.fillRect(0, 0, w, h);
    FONT_PX = fontFor(CELL);
    baseCtx.font = `500 ${FONT_PX}px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace`;
    baseCtx.textBaseline = 'top';
    const cellW = CELL, cellH = Math.round(CELL * 1.55);
    const total = cols * rows;
    const chunk = 4500;
    let cellIdx = 0;
    while (cellIdx < total) {
      const end = Math.min(cellIdx + chunk, total);
      for (; cellIdx < end; cellIdx++) {
        const c = cellIdx % cols;
        const r = (cellIdx / cols) | 0;
        const b = adj(bright[cellIdx]);
        const m = edgeMag[cellIdx];
        const isEdge = m > edgeThresh;

        let ch;
        if (mode === 'edges') {
          if (!isEdge) continue;
          ch = EDGE_CHARS[edgeBin[cellIdx]];
        } else if (mode === 'fill') {
          if (b < 0.05) continue;
          ch = FILL_RAMP[Math.floor(b * (FILL_RAMP.length - 1))];
        } else { // hybrid
          if (isEdge) {
            ch = EDGE_CHARS[edgeBin[cellIdx]];
          } else {
            if (b < 0.06) continue;
            ch = FILL_RAMP[Math.floor(b * (FILL_RAMP.length - 1))];
          }
        }
        const pi = cellIdx * 4;
        const R = pixelsRGB[pi], G = pixelsRGB[pi+1], B = pixelsRGB[pi+2];
        baseCtx.fillStyle = colorFor(R, G, B, b, isEdge ? m : 0);
        baseCtx.fillText(ch, originX + c * cellW, originY + r * cellH);
      }
      setProgress(cellIdx / total);
      if (cellIdx < total) await new Promise(r => requestAnimationFrame(r));
    }
    setProgress(1);
    renderingBase = false;
  }

  function loadImage(src) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { sourceImg = img; layoutAndSample(); renderBase(); };
    img.src = src;
  }

  // Same shaded placeholder
  const PLACEHOLDER_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 850'>
    <defs>
      <radialGradient id='head' cx='40%' cy='35%' r='60%'>
        <stop offset='0%' stop-color='#fff'/>
        <stop offset='60%' stop-color='#aaa'/>
        <stop offset='100%' stop-color='#333'/>
      </radialGradient>
      <linearGradient id='torso' x1='20%' y1='0%' x2='80%' y2='100%'>
        <stop offset='0%' stop-color='#666'/><stop offset='50%' stop-color='#aaa'/><stop offset='100%' stop-color='#222'/>
      </linearGradient>
      <linearGradient id='arm' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='#888'/><stop offset='100%' stop-color='#222'/></linearGradient>
    </defs>
    <rect width='600' height='850' fill='#050507'/>
    <ellipse cx='270' cy='150' rx='78' ry='95' fill='url(#head)'/>
    <path d='M 240 235 Q 270 250 305 240 L 320 280 L 245 285 Z' fill='#888'/>
    <path d='M 175 285 Q 210 305 280 295 L 360 295 Q 425 305 440 380 Q 445 440 415 490 Q 360 510 280 500 L 220 490 Q 155 410 175 285 Z' fill='url(#torso)'/>
    <path d='M 365 320 Q 440 290 445 215 Q 425 192 388 210 Q 365 250 345 290 Z' fill='url(#arm)'/>
    <ellipse cx='418' cy='192' rx='34' ry='28' fill='#bbb'/>
    <path d='M 215 370 Q 175 470 235 560 Q 280 605 330 625 L 355 605 Q 305 565 280 495 Q 245 425 225 370 Z' fill='#555'/>
    <path d='M 220 480 Q 245 545 218 635 L 195 800 L 320 800 L 348 635 Q 388 555 348 480 Q 285 495 220 480 Z' fill='#444'/>
    <rect x='80' y='800' width='440' height='8' fill='#333'/>
  </svg>`;
  const PLACEHOLDER_URL = 'data:image/svg+xml;utf8,' + encodeURIComponent(PLACEHOLDER_SVG);

  function frame() {
    ms.x += (mouse.x - ms.x) * 0.22;
    ms.y += (mouse.y - ms.y) * 0.22;
    const speed = Math.hypot(mouse.x - mouse.lx, mouse.y - mouse.ly);
    mouse.lx = mouse.x; mouse.ly = mouse.y;
    ms.intensity += (Math.min(speed, 80) / 80 - ms.intensity) * 0.08;

    const w = window.innerWidth, h = window.innerHeight;

    if (renderingBase || !bright) {
      ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
    } else {
      ctx.drawImage(base, 0, 0, base.width, base.height, 0, 0, w, h);
    }

    if (bright && !renderingBase && mouse.x > -1000) {
      const cx = ms.x, cy = ms.y;
      const reach = RADIUS + PUSH_MAX + CELL * 2;
      const rx0 = Math.max(0, cx - reach), ry0 = Math.max(0, cy - reach);
      const rx1 = Math.min(w, cx + reach), ry1 = Math.min(h, cy + reach);
      ctx.fillStyle = BG;
      ctx.fillRect(rx0, ry0, rx1 - rx0, ry1 - ry0);

      const cellW = CELL, cellH = Math.round(CELL * 1.55);
      const cMin = Math.max(0, Math.floor((rx0 - originX) / cellW));
      const cMax = Math.min(cols, Math.ceil((rx1 - originX) / cellW));
      const rMin = Math.max(0, Math.floor((ry0 - originY) / cellH));
      const rMax = Math.min(rows, Math.ceil((ry1 - originY) / cellH));

      ctx.font = `500 ${FONT_PX}px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace`;
      ctx.textBaseline = 'top';

      const RADIUS_SQ = RADIUS * RADIUS;
      for (let r = rMin; r < rMax; r++) {
        for (let c = cMin; c < cMax; c++) {
          const cellIdx = r * cols + c;
          let b = adj(bright[cellIdx]);
          const m = edgeMag[cellIdx];
          const isEdge = m > edgeThresh;

          const baseX = originX + c * cellW;
          const baseY = originY + r * cellH;
          const dx = baseX - cx, dy = baseY - cy;
          const d2 = dx * dx + dy * dy;
          let x = baseX, y = baseY, hueBoost = 0, edgeBoost = 0;
          if (d2 < RADIUS_SQ) {
            const d = Math.sqrt(d2);
            const f = 1 - d / RADIUS;
            const fs = f * f * (3 - 2 * f);
            const a = Math.atan2(dy, dx);
            const push = PUSH_MAX * fs * (0.55 + ms.intensity * 0.7);
            x += Math.cos(a) * push;
            y += Math.sin(a) * push;
            b = Math.min(1, b + fs * 0.45);
            edgeBoost = fs * 0.3;
            hueBoost = fs * 18;
          }

          let ch;
          if (mode === 'edges') {
            if (!isEdge) continue;
            ch = EDGE_CHARS[edgeBin[cellIdx]];
          } else if (mode === 'fill') {
            if (b < 0.05) continue;
            ch = FILL_RAMP[Math.floor(b * (FILL_RAMP.length - 1))];
          } else {
            if (isEdge) ch = EDGE_CHARS[edgeBin[cellIdx]];
            else {
              if (b < 0.06) continue;
              ch = FILL_RAMP[Math.floor(b * (FILL_RAMP.length - 1))];
            }
          }
          const pi = cellIdx * 4;
          const R = pixelsRGB[pi], G = pixelsRGB[pi+1], B = pixelsRGB[pi+2];
          ctx.fillStyle = colorFor(R, G, B, b, isEdge ? m + edgeBoost : edgeBoost);
          ctx.fillText(ch, x, y);
        }
      }
    }
    requestAnimationFrame(frame);
  }

  // Events
  let resizeTO;
  window.addEventListener('resize', () => { clearTimeout(resizeTO); resizeTO = setTimeout(resize, 80); });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  document.getElementById('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadImage(URL.createObjectURL(f)); });

  document.getElementById('cellSize').addEventListener('input', e => {
    CELL = +e.target.value; document.getElementById('cellVal').textContent = CELL + 'px';
    layoutAndSample(); renderBase();
  });
  document.getElementById('thresh').addEventListener('input', e => {
    edgeThresh = +e.target.value / 100; document.getElementById('threshVal').textContent = edgeThresh.toFixed(2);
    renderBase();
  });
  document.getElementById('sigma').addEventListener('input', e => {
    dogSigma = +e.target.value / 10; document.getElementById('sigmaVal').textContent = dogSigma.toFixed(2);
    computeFields(); renderBase();
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); mode = b.dataset.mode; renderBase();
  }));
  document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-color]').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); colorKey = b.dataset.color; renderBase();
  }));
  document.getElementById('invertBtn').addEventListener('click', () => { invert = !invert; renderBase(); });
  document.getElementById('exportBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `ascii-edges-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png'); link.click();
  });

  resize();
  loadImage(PLACEHOLDER_URL);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
