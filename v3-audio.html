<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>v3 — Audio-Reactive ASCII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #06070b; --fg: #c084fc; --line: rgba(255,255,255,0.16); --soft: rgba(255,255,255,0.4); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
  body { cursor: crosshair; }
  canvas#ascii { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .badge { position: fixed; top: 24px; right: 24px; background: var(--fg); color: #06070b; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px; padding: 11px 18px; border-radius: 2px; text-decoration: none; z-index: 10; }
  .brand { position: fixed; top: 24px; left: 24px; z-index: 10; font-size: 13px; letter-spacing: 0.04em; color: rgba(255,255,255,0.85); }
  .brand b { color: var(--fg); font-weight: 600; }
  .brand small { display: block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--soft); margin-top: 4px; }
  .meta { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft); text-align: center; line-height: 1.7; }
  .meta b { color: var(--fg); font-weight: 600; }
  .home { position: fixed; top: 24px; left: 240px; z-index: 10; color: var(--soft); text-decoration: none; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--line); border-radius: 2px; }
  .home:hover { color: #fff; border-color: var(--fg); }

  .panel { position: fixed; left: 24px; right: 24px; bottom: 24px; z-index: 10; display: flex; gap: 14px; align-items: stretch; padding: 14px 18px; background: rgba(15, 15, 18, 0.78); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); border: 1px solid var(--line); border-radius: 4px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
  .panel .group { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 0 0 auto; }
  .panel .group.flex { flex: 1 1 auto; min-width: 130px; }
  .panel .group .label { color: rgba(255,255,255,0.4); }
  .panel .group .value { color: var(--fg); font-variant-numeric: tabular-nums; }
  .panel .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel button, .panel label.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; background: transparent; color: rgba(255,255,255,0.85); font-family: inherit; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; transition: border-color .2s, color .2s, background .2s; white-space: nowrap; }
  .panel button:hover, .panel label.btn:hover { border-color: var(--fg); color: #fff; }
  .panel button.active { background: var(--fg); color: #06070b; border-color: var(--fg); }
  .panel input[type="file"] { display: none; }
  .panel input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: ew-resize; margin: 0; }
  .panel input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 1px; }
  .panel input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; margin-top: -4px; background: var(--fg); border-radius: 50%; border: 2px solid #06070b; transition: transform .15s; }

  /* Audio meter at top of panel */
  .meter { display: flex; gap: 2px; align-items: flex-end; height: 24px; padding: 2px 0; min-width: 200px; }
  .meter .bar { flex: 1; background: var(--fg); opacity: 0.65; min-width: 3px; transition: height 0.05s ease-out; }
  .progress { position: fixed; top: 0; left: 0; height: 2px; width: 0%; background: var(--fg); z-index: 100; }
  .progress.hidden { opacity: 0; transition: opacity .3s ease; }
  audio { display: none; }
</style>
</head>
<body>
  <canvas id="ascii"></canvas>
  <audio id="audio" crossorigin="anonymous"></audio>
  <div class="progress hidden" id="progress"></div>

  <div class="brand">
    Raul Chio · <b>ASCII Lab</b>
    <small>v3 · Audio-Reactive</small>
  </div>
  <a class="home" href="index.html">← lab</a>

  <div class="meta">
    <b id="trackInfo">no audio loaded</b><br />
    Bass→radius · Mid→glitch · High→hue
  </div>

  <a class="badge" href="#">v3 / audio</a>

  <div class="panel">
    <div class="group">
      <span class="label">Image</span>
      <label class="btn" for="imgFile">Drop image</label>
      <input type="file" id="imgFile" accept="image/*" />
    </div>
    <div class="group">
      <span class="label">Audio</span>
      <label class="btn" for="audioFile">Drop mp3</label>
      <input type="file" id="audioFile" accept="audio/*" />
    </div>
    <div class="group">
      <span class="label">Spectrum</span>
      <div class="meter" id="meter"></div>
    </div>
    <div class="group flex">
      <div class="row"><span class="label">Bass gain</span><span class="value" id="bassVal">1.6</span></div>
      <input type="range" id="bassGain" min="0" max="40" step="1" value="16" />
    </div>
    <div class="group flex">
      <div class="row"><span class="label">Glitch</span><span class="value" id="glitchVal">0.30</span></div>
      <input type="range" id="glitch" min="0" max="100" step="1" value="30" />
    </div>
    <div class="group">
      <span class="label">Color</span>
      <div class="row">
        <button data-color="purple" class="active">Purple</button>
        <button data-color="rose">Rose</button>
        <button data-color="amber">Amber</button>
        <button data-color="true">True</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Action</span>
      <div class="row">
        <button id="playBtn">Play</button>
        <button id="snapBtn">Snap PNG</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('ascii');
  const ctx = canvas.getContext('2d', { alpha: false });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const audio = document.getElementById('audio');
  const base = document.createElement('canvas');
  const baseCtx = base.getContext('2d', { alpha: false });
  const sample = document.createElement('canvas');
  const sampleCtx = sample.getContext('2d', { willReadFrequently: true });

  const FILL_RAMP = ' .\'`,:;!iI?ltjf1234567890[]{}|()*#$@%MW&8B';
  const GLITCH_RAMP = '!@#$%^&*()_+-=[]{}|;:,.<>?/0123456789';
  const PALETTES = {
    purple: { hue: 280, sat: 70, baseL: 25, gainL: 60 },
    rose:   { hue: 345, sat: 80, baseL: 28, gainL: 56 },
    amber:  { hue: 28,  sat: 88, baseL: 22, gainL: 56 },
  };
  let colorKey = 'purple';
  let CELL = 6, FONT_PX = 10;

  let sourceImg = null;
  let pixels = null;
  let cols = 0, rows = 0, originX = 0, originY = 0;

  let audioCtx = null, analyser = null, srcNode = null;
  const FFT_SIZE = 1024;
  let freqData = null;
  let bass = 0, mid = 0, high = 0;
  let bassEMA = 0, midEMA = 0, highEMA = 0;
  let bassGain = 1.6;
  let glitchAmt = 0.30;

  const mouse = { x: -9999, y: -9999, lx: -9999, ly: -9999 };
  const ms = { x: 0, y: 0, intensity: 0 };
  const RADIUS = 200, PUSH_MAX = 30;
  const BG = '#06070b';

  function fontFor(cell) { return Math.max(5, Math.round(cell * 1.6)); }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    base.width = canvas.width; base.height = canvas.height;
    baseCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutAndSample();
    renderBase();
  }

  function layoutAndSample() {
    if (!sourceImg) return;
    const w = window.innerWidth, h = window.innerHeight;
    const ar = sourceImg.width / sourceImg.height;
    let targetH = h * 0.92;
    let targetW = targetH * ar;
    if (targetW > w * 0.92) { targetW = w * 0.92; targetH = targetW / ar; }
    const cellW = CELL, cellH = Math.round(CELL * 1.55);
    cols = Math.max(2, Math.floor(targetW / cellW));
    rows = Math.max(2, Math.floor(targetH / cellH));
    originX = (w - cols * cellW) / 2;
    originY = (h - rows * cellH) / 2;
    sample.width = cols; sample.height = rows;
    sampleCtx.fillStyle = '#000'; sampleCtx.fillRect(0, 0, cols, rows);
    sampleCtx.drawImage(sourceImg, 0, 0, cols, rows);
    pixels = sampleCtx.getImageData(0, 0, cols, rows).data;
  }

  function colorFor(R, G, B, b, hueExtra) {
    if (colorKey === 'true') {
      const max = Math.max(R, G, B), min = Math.min(R, G, B);
      const lum = (max + min) / 510;
      const targetL = 0.32 + b * 0.55;
      const k = lum > 0 ? Math.min(2.5, targetL / lum) : 1;
      return `rgb(${Math.min(255, R * k)|0},${Math.min(255, G * k)|0},${Math.min(255, B * k)|0})`;
    }
    const p = PALETTES[colorKey] || PALETTES.purple;
    const hue = p.hue + hueExtra;
    const light = p.baseL + b * p.gainL;
    return `hsl(${hue}, ${p.sat}%, ${light}%)`;
  }

  function setProgress(p) {
    const el = document.getElementById('progress');
    if (p >= 1 || p < 0) { el.classList.add('hidden'); el.style.width = '0%'; }
    else { el.classList.remove('hidden'); el.style.width = (p * 100).toFixed(1) + '%'; }
  }

  let renderingBase = false;
  async function renderBase() {
    if (!pixels) return;
    renderingBase = true;
    const w = window.innerWidth, h = window.innerHeight;
    baseCtx.fillStyle = BG; baseCtx.fillRect(0, 0, w, h);
    FONT_PX = fontFor(CELL);
    baseCtx.font = `500 ${FONT_PX}px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace`;
    baseCtx.textBaseline = 'top';
    const cellW = CELL, cellH = Math.round(CELL * 1.55);
    const total = cols * rows, chunk = 4500;
    let i = 0;
    while (i < total) {
      const end = Math.min(i + chunk, total);
      for (; i < end; i++) {
        const c = i % cols, r = (i / cols) | 0;
        const pi = i * 4;
        const R = pixels[pi], G = pixels[pi+1], B = pixels[pi+2];
        const lum = (0.299 * R + 0.587 * G + 0.114 * B) / 255;
        if (lum < 0.05) continue;
        const ch = FILL_RAMP[Math.floor(lum * (FILL_RAMP.length - 1))];
        baseCtx.fillStyle = colorFor(R, G, B, lum, 0);
        baseCtx.fillText(ch, originX + c * cellW, originY + r * cellH);
      }
      setProgress(i / total);
      if (i < total) await new Promise(r => requestAnimationFrame(r));
    }
    setProgress(1);
    renderingBase = false;
  }

  function loadImage(src) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { sourceImg = img; layoutAndSample(); renderBase(); };
    img.src = src;
  }

  // ───────── Audio setup ─────────
  function ensureAudioCtx() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    srcNode = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.7;
    srcNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }

  function loadAudio(file) {
    const url = URL.createObjectURL(file);
    audio.src = url;
    audio.load();
    document.getElementById('trackInfo').textContent = `▶ ${file.name}`;
  }

  function readSpectrum() {
    if (!analyser) { bass = 0; mid = 0; high = 0; return; }
    analyser.getByteFrequencyData(freqData);
    const N = freqData.length;
    const bassEnd = Math.floor(N * 0.05);
    const midEnd = Math.floor(N * 0.30);
    let b = 0, m = 0, hi = 0;
    for (let i = 0; i < bassEnd; i++) b += freqData[i];
    for (let i = bassEnd; i < midEnd; i++) m += freqData[i];
    for (let i = midEnd; i < N; i++) hi += freqData[i];
    bass = b / (bassEnd * 255);
    mid = m / ((midEnd - bassEnd) * 255);
    high = hi / ((N - midEnd) * 255);

    bassEMA += (bass - bassEMA) * 0.3;
    midEMA += (mid - midEMA) * 0.25;
    highEMA += (high - highEMA) * 0.4;

    // Update meter
    const meter = document.getElementById('meter');
    if (meter.children.length === 0) {
      for (let i = 0; i < 16; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        meter.appendChild(bar);
      }
    }
    const step = Math.floor(N / 16);
    for (let i = 0; i < 16; i++) {
      let v = 0;
      for (let j = 0; j < step; j++) v += freqData[i * step + j];
      v = v / (step * 255);
      meter.children[i].style.height = (v * 22 + 2) + 'px';
    }
  }

  // ───────── Frame loop ─────────
  function frame() {
    readSpectrum();

    // Auto-cursor: if mouse not present, drift cursor with bass kick around image center
    const w = window.innerWidth, h = window.innerHeight;
    const cx0 = w / 2, cy0 = h / 2;
    const t = performance.now() * 0.001;
    let mx, my;
    if (mouse.x > -1000) {
      mx = mouse.x; my = mouse.y;
    } else {
      const r = 80 + bassEMA * 200;
      mx = cx0 + Math.cos(t * 1.3) * r;
      my = cy0 + Math.sin(t * 1.7) * r * 0.6;
    }

    ms.x += (mx - ms.x) * 0.18;
    ms.y += (my - ms.y) * 0.18;
    const speed = Math.hypot(mx - mouse.lx, my - mouse.ly);
    mouse.lx = mx; mouse.ly = my;
    ms.intensity += (Math.min(speed, 80) / 80 - ms.intensity) * 0.08;

    if (renderingBase || !pixels) {
      ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
    } else {
      ctx.drawImage(base, 0, 0, base.width, base.height, 0, 0, w, h);
    }

    if (!pixels || renderingBase) { requestAnimationFrame(frame); return; }

    // Audio-driven cursor reach
    const radius = RADIUS + bassEMA * bassGain * 180;
    const reach = radius + PUSH_MAX + CELL * 2;
    const cx = ms.x, cy = ms.y;
    const rx0 = Math.max(0, cx - reach), ry0 = Math.max(0, cy - reach);
    const rx1 = Math.min(w, cx + reach), ry1 = Math.min(h, cy + reach);
    ctx.fillStyle = BG; ctx.fillRect(rx0, ry0, rx1 - rx0, ry1 - ry0);

    const cellW = CELL, cellH = Math.round(CELL * 1.55);
    const cMin = Math.max(0, Math.floor((rx0 - originX) / cellW));
    const cMax = Math.min(cols, Math.ceil((rx1 - originX) / cellW));
    const rMin = Math.max(0, Math.floor((ry0 - originY) / cellH));
    const rMax = Math.min(rows, Math.ceil((ry1 - originY) / cellH));

    ctx.font = `500 ${FONT_PX}px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace`;
    ctx.textBaseline = 'top';
    const RADIUS_SQ = radius * radius;
    const glitchActive = midEMA * glitchAmt;

    for (let r = rMin; r < rMax; r++) {
      for (let c = cMin; c < cMax; c++) {
        const idx = r * cols + c;
        const pi = idx * 4;
        const R = pixels[pi], G = pixels[pi+1], B = pixels[pi+2];
        const lum = (0.299 * R + 0.587 * G + 0.114 * B) / 255;
        let b = lum;

        const baseX = originX + c * cellW;
        const baseY = originY + r * cellH;
        const dx = baseX - cx, dy = baseY - cy;
        const d2 = dx * dx + dy * dy;
        let x = baseX, y = baseY, hueExtra = 0;
        if (d2 < RADIUS_SQ) {
          const d = Math.sqrt(d2);
          const f = 1 - d / radius;
          const fs = f * f * (3 - 2 * f);
          const a = Math.atan2(dy, dx);
          const push = PUSH_MAX * fs * (0.5 + ms.intensity * 0.4 + bassEMA * 1.2);
          x += Math.cos(a) * push;
          y += Math.sin(a) * push;
          b = Math.min(1, b + fs * (0.4 + bassEMA * 0.6));
          hueExtra = fs * (15 + highEMA * 60);
        }
        if (b < 0.05) continue;

        // Glitch char swap based on mid frequencies
        let ch;
        if (Math.random() < glitchActive) {
          ch = GLITCH_RAMP[Math.floor(Math.random() * GLITCH_RAMP.length)];
        } else {
          ch = FILL_RAMP[Math.floor(b * (FILL_RAMP.length - 1))];
        }

        ctx.fillStyle = colorFor(R, G, B, b, hueExtra + highEMA * 30);
        ctx.fillText(ch, x, y);
      }
    }

    requestAnimationFrame(frame);
  }

  // Placeholder image (same shaded silhouette)
  const PLACEHOLDER_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 850'>
    <defs>
      <radialGradient id='head' cx='40%' cy='35%' r='60%'><stop offset='0%' stop-color='#fff'/><stop offset='60%' stop-color='#aaa'/><stop offset='100%' stop-color='#333'/></radialGradient>
      <linearGradient id='torso' x1='20%' y1='0%' x2='80%' y2='100%'><stop offset='0%' stop-color='#666'/><stop offset='50%' stop-color='#aaa'/><stop offset='100%' stop-color='#222'/></linearGradient>
    </defs>
    <rect width='600' height='850' fill='#050507'/>
    <ellipse cx='270' cy='150' rx='78' ry='95' fill='url(#head)'/>
    <path d='M 175 285 Q 210 305 280 295 L 360 295 Q 425 305 440 380 Q 445 440 415 490 Q 360 510 280 500 L 220 490 Q 155 410 175 285 Z' fill='url(#torso)'/>
    <path d='M 365 320 Q 440 290 445 215 Q 425 192 388 210 Q 365 250 345 290 Z' fill='#888'/>
    <ellipse cx='418' cy='192' rx='34' ry='28' fill='#ccc'/>
    <path d='M 215 370 Q 175 470 235 560 Q 280 605 330 625 L 355 605 Q 305 565 280 495 Q 245 425 225 370 Z' fill='#555'/>
    <path d='M 220 480 Q 245 545 218 635 L 195 800 L 320 800 L 348 635 Q 388 555 348 480 Q 285 495 220 480 Z' fill='#444'/>
  </svg>`;
  loadImage('data:image/svg+xml;utf8,' + encodeURIComponent(PLACEHOLDER_SVG));

  // Events
  let resizeTO;
  window.addEventListener('resize', () => { clearTimeout(resizeTO); resizeTO = setTimeout(resize, 80); });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  document.getElementById('imgFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadImage(URL.createObjectURL(f)); });
  document.getElementById('audioFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadAudio(f); });
  document.getElementById('playBtn').addEventListener('click', () => {
    ensureAudioCtx();
    if (audio.paused) { audio.play(); document.getElementById('playBtn').textContent = 'Pause'; }
    else { audio.pause(); document.getElementById('playBtn').textContent = 'Play'; }
  });
  document.getElementById('bassGain').addEventListener('input', e => {
    bassGain = +e.target.value / 10; document.getElementById('bassVal').textContent = bassGain.toFixed(2);
  });
  document.getElementById('glitch').addEventListener('input', e => {
    glitchAmt = +e.target.value / 100; document.getElementById('glitchVal').textContent = glitchAmt.toFixed(2);
  });
  document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-color]').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); colorKey = b.dataset.color; renderBase();
  }));
  document.getElementById('snapBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `ascii-audio-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png'); link.click();
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
